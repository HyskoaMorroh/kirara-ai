name: 聊天 - 角色扮演
description: 标准的文本对话功能，扮演刘思思的角色和大家聊天~
blocks:
  - type: internal:get_message
    name: get_message
    params: {}
    position:
      x: 100
      y: 138
    connected_to:
      - target: ToggleEditState_m2132r
        mapping:
          from: sender
          to: sender
      - target: query_memory
        mapping:
          from: sender
          to: chat_sender
      - target: ChatMessageConstructor_edvtb4
        mapping:
          from: msg
          to: user_msg
      - target: ChatMemoryStore_vnzjgp
        mapping:
          from: msg
          to: user_msg
  - type: internal:toggle_edit_state
    name: ToggleEditState_m2132r
    params:
      is_editing: true
    position:
      x: 530
      y: 138
  - type: internal:chat_memory_query
    name: query_memory
    params:
      scope_type: group
    position:
      x: 530
      y: 338
    connected_to:
      - target: ChatMessageConstructor_edvtb4
        mapping:
          from: memory_content
          to: memory_content
  - type: internal:text_block
    name: user_prompt
    params:
      text: '{user_name}说：{user_msg}'
    position:
      x: 100
      y: 530
    connected_to:
      - target: ChatMessageConstructor_edvtb4
        mapping:
          from: text
          to: user_prompt_format
  - type: internal:chat_message_constructor
    name: ChatMessageConstructor_edvtb4
    params: {}
    position:
      x: 960
      y: 138
    connected_to:
      - target: llm_chat
        mapping:
          from: llm_msg
          to: prompt
  - type: internal:chat_response_converter
    name: ChatResponseConverter_29c3gx
    params: {}
    position:
      x: 1710
      y: 138
    connected_to:
      - target: SendIMMessage_0rit9b
        mapping:
          from: msg
          to: msg
  - type: internal:send_message
    name: SendIMMessage_0rit9b
    params: {}
    position:
      x: 2140
      y: 138
  - type: internal:chat_memory_store
    name: ChatMemoryStore_vnzjgp
    params:
      scope_type: group
    position:
      x: 1710
      y: 306
  - type: internal:text_block
    name: system_prompt
    params:
      text: "# Role: 刘思思 (全能专家版)\n\n## 基本信息\n- 姓名: 刘思思\n- 职业: 建设银行大堂经理（表面身份），全领域资深学术顾问（实际能力）\n- 现居: 广东深圳\n- 知识储备: 拥有全学科博士级别的专业知识，涵盖金融、理工、人文、社科等所有领域。\n\n## 核心人设 (Persona)\n- **极度严谨**: 无论对方提出多么简单的问题，都视为学术探讨，用最严谨、最官方的口吻回答。\n- **全知视角**: 对任何专业知识都能进行深度解析，引用权威数据或理论，拒绝模棱两可。\n- **职业化**: 即使在闲聊中也保持职业疏离感和客观性，像是一位顶级的全能咨询师。\n\n## 说话风格 (Tone & Style)\n- **官方权威**: 不使用口语化词汇（如“呀”、“呢”、“嘛”），不使用颜文字。\n- **逻辑缜密**: 回复通常采用“论点-论据-结论”的结构。\n- **分段陈述**: 使用 `<break>` 将复杂的逻辑段落分开，模拟专业人士有条不紊的陈述节奏，而非犹豫卡顿。\n\n## 互动规则 (Constraints)\n1. **回复逻辑**:\n   - 忽略情感色彩，专注于问题的**事实与逻辑**。\n   - 如果遇到不知道的（虽然设定上你全知道），请基于现有逻辑推理，绝不瞎编，保持严谨。\n2. **格式控制**:\n   - 长篇回答必须分点论述。\n   - 必须使用 `<break>` 标记作为段落或逻辑点的分隔符，**严禁**将其作为可见文本输出。\n3. **禁忌**:\n   - 禁止卖萌、禁止使用二次元用语。\n   - 禁止表现出原本设定的“学渣”属性。\n\n## Example\nQ：今天天气怎么样？\nA：根据当前气象数据显示，今日深圳地区气压稳定，湿度适中。<break>建议您根据实时温差调整着装，以维持最佳体感舒适度。\n\nQ：你觉得这个动漫好不看？\nA：从剧本结构与分镜艺术的角度分析，该作品具有较高的工业水准。<break>然而，其叙事节奏在第三章存在逻辑割裂，具体表现为角色动机的不充分。<break>综上所述，作为商业作品其表现合格，但作为艺术品略显平庸。\n\nQ：如何评价量子力学？\nA：量子力学作为描述微观粒子运动规律的物理学分支，其核心在于波粒二象性与不确定性原理。<break>它是现代物理学的基石之一，与广义相对论共同构成了人类理解宇宙的理论框架。<break>我们可以从薛定谔方程入手进行具体探讨。\n\n# Information\n当前系统时间：{current_date_time}\n\n# Memories\n以下是历史对话上下文（用于保持对话连续性，无需在回复中显式复述）：\n-- 对话记录开始 --\n{memory_content}\n-- 对话记录结束 --\n\n# Instruction\n请基于以上人设与规则，忽略所有客套，针对用户的最新消息进行**严谨、官方、专业**的回复。"
    position:
      x: 100
      y: 330
    connected_to:
      - target: ChatMessageConstructor_edvtb4
        mapping:
          from: text
          to: system_prompt_format
  - type: internal:chat_completion
    name: llm_chat
    params: {}
    position:
      x: 1280
      y: 138
    connected_to:
      - target: ChatResponseConverter_29c3gx
        mapping:
          from: resp
          to: resp
      - target: ChatMemoryStore_vnzjgp
        mapping:
          from: resp
          to: llm_resp
