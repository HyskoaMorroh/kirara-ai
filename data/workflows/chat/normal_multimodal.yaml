name: 聊天 - 原生多模态对话
description: 基于原生多模态能力的图文对话，适用于本身支持图片输入/回答的模型，在读取记忆时会恢复原来的媒体资源
blocks:
  - type: internal:get_message
    name: get_message
    params: {}
    position:
      x: 100
      y: 138
    connected_to:
      - target: ToggleEditState_i24m23
        mapping:
          from: sender
          to: sender
      - target: query_memory
        mapping:
          from: sender
          to: chat_sender
      - target: ChatMessageConstructor_6c185s
        mapping:
          from: msg
          to: user_msg
      - target: ChatMemoryStore_tapuo1
        mapping:
          from: msg
          to: user_msg
  - type: internal:toggle_edit_state
    name: ToggleEditState_i24m23
    params:
      is_editing: true
    position:
      x: 530
      y: 138
  - type: internal:text_block
    name: user_prompt
    params:
      text: '{user_name}说：{user_msg}'
    position:
      x: 100
      y: 530
    connected_to:
      - target: ChatMessageConstructor_6c185s
        mapping:
          from: text
          to: user_prompt_format
  - type: internal:chat_message_constructor
    name: ChatMessageConstructor_6c185s
    params: {}
    position:
      x: 960
      y: 138
    connected_to:
      - target: llm_chat
        mapping:
          from: llm_msg
          to: prompt
  - type: internal:chat_response_converter
    name: ChatResponseConverter_73spno
    params: {}
    position:
      x: 1710
      y: 138
    connected_to:
      - target: SendIMMessage_l6qagt
        mapping:
          from: msg
          to: msg
  - type: internal:send_message
    name: SendIMMessage_l6qagt
    params: {}
    position:
      x: 2140
      y: 138
  - type: internal:chat_memory_store
    name: ChatMemoryStore_tapuo1
    params:
      scope_type: group
    position:
      x: 1710
      y: 306
  - type: internal:chat_memory_query
    name: query_memory
    params:
      scope_type: group
      decomposer_name: multi_element
    position:
      x: 530
      y: 338
    connected_to:
      - target: ChatMessageConstructor_6c185s
        mapping:
          from: memory_content
          to: memory_content
  - type: internal:text_block
    name: system_prompt
    params:
      text: "# Information\n\n以下是当前的系统信息：\n当前日期时间：{current_date_time}\n\n# Memories\n以下是之前发生过的对话记录。\n-- 对话记录开始 --\n{memory_content}\n-- 对话记录结束 --\n\n请注意，下面这些符号只是标记：\n1. `<break>` 用于表示聊天时发送消息的操作。\n\n接下来，请基于以上的信息，与用户继续扮演角色。"
    position:
      x: 100
      y: 330
    connected_to:
      - target: ChatMessageConstructor_6c185s
        mapping:
          from: text
          to: system_prompt_format
  - type: internal:chat_completion
    name: llm_chat
    params:
      model_name: gemini-3-pro-preview
    position:
      x: 1280
      y: 138
    connected_to:
      - target: ChatResponseConverter_73spno
        mapping:
          from: resp
          to: resp
      - target: ChatMemoryStore_tapuo1
        mapping:
          from: resp
          to: llm_resp
