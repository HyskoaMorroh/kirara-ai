name: Release Preflight

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Release contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run release contract checks
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/test_release_workflow_contract.py tests/test_webui_build_contract.py -q

  webui:
    name: WebUI type check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: webui/yarn.lock

      - name: Build production WebUI
        working-directory: webui
        env:
          VITE_APP_VERSION: v0.0.0-ci
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn type-check
          yarn build
