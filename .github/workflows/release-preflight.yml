name: Release Preflight

# ---------------------------------------------------------------------------
# 这里是「发布产物」的门禁，负责在昂贵的发布流程启动前就拦住回归：
#   * contracts：断言发布类工作流与打包配置本身没有退化（权限、镜像缓存、
#     VITE_APP_VERSION 注入、wheel package-data、CI 触发条件等）。它们只读
#     文件、秒级完成，因此排在最前面。
#   * webui：前端门禁。vue-tsc 类型检查 → vitest 单元测试 → 生产构建，
#     顺序即「便宜的先失败」：类型错误不必等到打包才发现。
#   * webui-lint：ESLint 报告。仓库现存 25 errors / 136 warnings，直接 gate
#     会让每个 PR 变红，等于逼人绕过门禁；因此这里以 continue-on-error 输出
#     报告 + artifact，作为存量清理的度量，不阻塞合并。这是新增的可见性，
#     不是对既有检查的降级——此前没有任何前端 lint 在 CI 里跑过。
#   * 后端测试（全量用例）在 run-tests.yml，覆盖同样的 PR / push / merge_group
#     触发，这里不重复执行。
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      run_backend_and_image:
        description: "Run the reusable backend matrix and Docker image smoke gate."
        required: false
        type: boolean
        default: false
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-release-preflight-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    name: Version synchronization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify synchronized versions
        run: python scripts/version.py check

  backend-and-image:
    name: Backend matrix and Docker smoke
    needs: version
    if: ${{ inputs.run_backend_and_image }}
    uses: ./.github/workflows/run-tests.yml
    secrets: inherit

  contracts:
    name: Release contracts
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run release contract checks
        run: |
          python -m pip install --upgrade pip pytest uv
          python scripts/version.py check
          uv build --out-dir dist-release-check
          python - <<'PY'
          import os
          from pathlib import Path

          # uv may place a helper .gitignore in the output directory. Only
          # distribution archives belong to this release gate.
          archives = sorted(
              path
              for path in Path("dist-release-check").glob("*")
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          )
          wheel = [path for path in archives if path.suffix == ".whl"]
          sdist = [path for path in archives if path.name.endswith(".tar.gz")]
          if len(wheel) != 1 or len(sdist) != 1 or len(archives) != 2:
              raise SystemExit(
                  f"expected one wheel and one sdist, found: {[path.name for path in archives]}"
              )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(
                  "KIRARA_RELEASE_ARCHIVES="
                  + os.pathsep.join(str(path.resolve()) for path in archives)
                  + "\n"
              )
          PY

      - name: Inspect release archives and contracts
        run: |
          python -m pip install --no-cache-dir dist-release-check/*.whl
          python -m pytest tests/test_a4_upgrade_contract.py -q
          python -m pytest \
            tests/test_release_artifact_contract.py \
            tests/test_release_workflow_contract.py \
            tests/test_webui_build_contract.py -q

      - name: Smoke-test a fresh wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/kirara-wheel-smoke"
          "$RUNNER_TEMP/kirara-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/kirara-wheel-smoke/bin/python" -m pip install --no-cache-dir dist-release-check/*.whl
          "$RUNNER_TEMP/kirara-wheel-smoke/bin/kirara_ai" --help >/dev/null
          expected_version="$(python scripts/version.py get)"
          cd "$RUNNER_TEMP"
          EXPECTED_RELEASE_VERSION="$expected_version" "$RUNNER_TEMP/kirara-wheel-smoke/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.util
          import os
          import pathlib

          import kirara_ai

          root = pathlib.Path(next(iter(importlib.util.find_spec("kirara_ai").submodule_search_locations)))
          assert pathlib.Path.cwd() != root.parent, (pathlib.Path.cwd(), root)
          assert importlib.metadata.version("kirara-ai") == os.environ["EXPECTED_RELEASE_VERSION"]
          assert (root / "workflow" / "presets" / "catalog.json").is_file()
          assert (root / "workflow" / "presets" / "chat" / "mcp_tools.yaml").is_file()
          assert (root / "web" / "static" / "backup.html").is_file()
          assert (root / "plugins" / "im_qqbot_adapter" / "assets" / "qqbot.png").is_file()
          assert (root / "plugins" / "im_onebot_adapter" / "assets" / "onebot.png").is_file()
          assert (root / "plugins" / "im_telegram_adapter" / "assets" / "telegram.png").is_file()
          assert (root / "plugins" / "im_wecom_adapter" / "assets" / "wecom.png").is_file()
          assert (root / "alembic" / "env.py").is_file()
          import kirara_ai.plugins.im_onebot_adapter.adapter
          import kirara_ai.web.api.system.readiness
          print("fresh wheel smoke OK:", kirara_ai.__file__)
          PY

  webui:
    name: WebUI type check, unit tests and production build
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: webui/yarn.lock

      - name: Verify synchronized versions
        run: python scripts/version.py check

      - name: Install WebUI dependencies
        working-directory: webui
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Resolve project release identity
        id: version
        run: echo "tag=$(python scripts/version.py tag)" >> "$GITHUB_OUTPUT"

      # 三步拆成独立 step：日志里能直接看出是类型、测试还是打包炸了，
      # 不必翻一大段合并输出。顺序保持「最便宜的先跑」。
      - name: Type-check WebUI
        working-directory: webui
        run: yarn type-check

      - name: Run WebUI unit tests
        working-directory: webui
        run: yarn test:unit

      - name: Build production WebUI
        working-directory: webui
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.tag }}
        # 这里刻意跑 `yarn build`（= run-p type-check build-only）而不是
        # `build-only`：Dockerfile 与 Windows 快速启动包用的就是 `yarn build`，
        # 门禁必须验证那条真实命令能跑通。代价是 type-check 跑了两遍（约 30s），
        # 换来的是「发布用的命令」被真正覆盖，值得。
        run: yarn build

      - name: Verify built WebUI release identity and asset manifest
        working-directory: webui
        env:
          EXPECTED_UI_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path("dist")
          index = root / "index.html"
          assert index.is_file(), "missing production index.html"
          metadata = json.loads((root / "version.json").read_text(encoding="utf-8"))
          expected = os.environ["EXPECTED_UI_VERSION"]
          package_version = subprocess.check_output(
              ["python", "../scripts/version.py", "npm"], text=True
          ).strip()
          assert metadata["version"] == expected, metadata
          assert metadata["packageVersion"] == package_version, metadata
          for asset in re.findall(r'(?:src|href)="/?(assets/[^"?#]+)', index.read_text(encoding="utf-8")):
              assert (root / asset).is_file(), f"index references missing asset: {asset}"
          print("WebUI release identity and asset manifest OK")
          PY

      - name: Upload WebUI build output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: warn
          retention-days: 7

  webui-lint:
    name: WebUI lint report (non-blocking)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: webui/yarn.lock

      - name: Install WebUI dependencies
        working-directory: webui
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Report ESLint findings
        working-directory: webui
        # 不用 `yarn lint`：那个脚本带 --fix，在 CI 里改文件毫无意义。
        continue-on-error: true
        run: |
          set -o pipefail
          npx eslint src/ \
            --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts \
            --ignore-path .gitignore 2>&1 | tee eslint-report.txt || true
          {
            echo "### ESLint report"
            echo
            echo '```'
            tail -n 40 eslint-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: webui-eslint-report
          path: webui/eslint-report.txt
          if-no-files-found: warn
          retention-days: 7
