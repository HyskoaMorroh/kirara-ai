name: PR Type Check

on:
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mypy-review:
    name: MyPy Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install type-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install mypy types-requests types-setuptools

      - name: Type-check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.py' > changed-python.txt
          mapfile -t files < changed-python.txt
          if (( ${#files[@]} == 0 )); then
            echo "No Python files changed."
            exit 0
          fi
          python -m mypy \
            --install-types \
            --non-interactive \
            --python-version 3.12 \
            --show-column-numbers \
            --show-error-codes \
            --ignore-missing-imports \
            "${files[@]}"
