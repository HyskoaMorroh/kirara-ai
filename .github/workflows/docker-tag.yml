name: Docker build with tags

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker Hub image tag to publish from the current default branch
        required: true
        type: string

concurrency:
  group: docker-tag-${{ inputs.image_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate default branch source
    runs-on: ubuntu-latest
    steps:
      - name: Require the repository default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Run this workflow from the repository default branch ($DEFAULT_BRANCH), not a tag or another branch."
            exit 1
          fi

  verify:
    # 手动发版同样必须走与正式 release 相同的完整可复用门禁。
    name: Pre-publish verification
    needs: validate-source
    uses: ./.github/workflows/release-preflight.yml
    with:
      run_backend_and_image: true
      release_tag: ${{ inputs.image_tag }}
      expected_commit: ${{ github.sha }}
    secrets: inherit

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout dispatch commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.release_commit }}
          fetch-depth: 0
      - name: Set up Python 3.11
        # 版本推导需要 tomllib（3.11+），且必须与其他 job 用同一个解释器版本，
        # 否则「同一发布身份」这条保证只在 runner 镜像默认版本恰好够用时成立。
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set output
        id: vars
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.release_commit }}
        run: |
          if [ -z "$INPUT_TAG" ]; then
            echo "Set image_tag before manually publishing a versioned image."
            exit 1
          fi
          source_commit="$(git rev-parse HEAD)"
          if [ "$source_commit" != "$EXPECTED_COMMIT" ]; then
            echo "Checkout commit $source_commit does not match the preflight commit $EXPECTED_COMMIT."
            exit 1
          fi
          git_tag="$(python scripts/version.py tag)"
          image_version="$(python scripts/version.py get)"
          if [ "$INPUT_TAG" != "$git_tag" ]; then
            echo "image_tag must match the source Git tag ($git_tag); got $INPUT_TAG."
            exit 1
          fi
          python scripts/version.py verify-tag \
            --tag "$INPUT_TAG" \
            --expected-commit "$source_commit" \
            --expect-head \
            --remote origin
          echo "git_tag=$git_tag" >> "$GITHUB_OUTPUT"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - name: Check output
        env:
          RELEASE_GIT_TAG: ${{ steps.vars.outputs.git_tag }}
          RELEASE_VERSION: ${{ steps.vars.outputs.image_version }}
        run: |
          echo "Git tag: $RELEASE_GIT_TAG"
          echo "Image version: $RELEASE_VERSION"
      -
        name: Resolve image name
        id: image
        env:
          IMAGE_NAME_VARIABLE: ${{ vars.DOCKERHUB_IMAGE }}
          IMAGE_NAME_SECRET: ${{ secrets.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_NAME="${IMAGE_NAME_VARIABLE:-$IMAGE_NAME_SECRET}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${DOCKERHUB_USERNAME}/kirara-agent-framework"
          fi
          if [ -z "$IMAGE_NAME" ]; then
            echo "Set DOCKERHUB_IMAGE as a repository variable or secret, or set DOCKERHUB_USERNAME before publishing."
            exit 1
          fi
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Resolved image name: $IMAGE_NAME"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: qemu workaround
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes -c yes
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: 'linux/amd64,linux/arm64'
          tags: ${{ steps.image.outputs.name }}:${{ steps.vars.outputs.image_version }}
          # 记录源提交，让「Tag 与提交绑定」在发布之后仍然可查。
          #
          # `verify-tag` 只检查当下的自洽（本地/远端 Tag 与 HEAD 一致）。它没有
          # 历史记录，所以「发布后把 Tag 移到另一个提交、再手动重建同一个
          # image_tag」这条时间线能全程通过校验，而 Docker Hub 上同名镜像的内容
          # 已经换了一份——且没有任何地方记录这件事。
          #
          # revision 取 `steps.vars` 里那个已经与 preflight 提交比对过的值，
          # 不用 `github.sha`：后者没经过那次比对，记下一个未校验的值会让这条
          # 标签失去意义。
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.source_commit }}
            org.opencontainers.image.version=${{ steps.vars.outputs.git_tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VITE_APP_VERSION=${{ steps.vars.outputs.git_tag }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
