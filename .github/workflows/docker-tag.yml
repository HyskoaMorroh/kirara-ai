name: Docker build with tags

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker Hub image tag to publish from the current default branch
        required: true
        type: string

concurrency:
  group: docker-tag-${{ inputs.image_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate default branch source
    runs-on: ubuntu-latest
    steps:
      - name: Require the repository default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Run this workflow from the repository default branch ($DEFAULT_BRANCH), not a tag or another branch."
            exit 1
          fi

  verify:
    # 手动发版同样必须走与正式 release 相同的完整可复用门禁。
    name: Pre-publish verification
    needs: validate-source
    uses: ./.github/workflows/release-preflight.yml
    with:
      run_backend_and_image: true
    secrets: inherit

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout dispatch commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Set output
        id: vars
        run: |
          INPUT_TAG="${{ inputs.image_tag }}"
          if [ -z "$INPUT_TAG" ]; then
            echo "Set image_tag before manually publishing a versioned image."
            exit 1
          fi
          git_tag="$(python3 scripts/version.py tag)"
          image_version="$(python3 scripts/version.py get)"
          if [ "$INPUT_TAG" != "$git_tag" ]; then
            echo "image_tag must match the source Git tag ($git_tag); got $INPUT_TAG."
            exit 1
          fi
          python3 scripts/version.py check --tag "$git_tag"
          echo "git_tag=$git_tag" >> "$GITHUB_OUTPUT"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
      - name: Check output
        env:
          RELEASE_GIT_TAG: ${{ steps.vars.outputs.git_tag }}
          RELEASE_VERSION: ${{ steps.vars.outputs.image_version }}
        run: |
          echo "Git tag: $RELEASE_GIT_TAG"
          echo "Image version: $RELEASE_VERSION"
      -
        name: Resolve image name
        id: image
        env:
          IMAGE_NAME_VARIABLE: ${{ vars.DOCKERHUB_IMAGE }}
          IMAGE_NAME_SECRET: ${{ secrets.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_NAME="${IMAGE_NAME_VARIABLE:-$IMAGE_NAME_SECRET}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${DOCKERHUB_USERNAME}/kirara-agent-framework"
          fi
          if [ -z "$IMAGE_NAME" ]; then
            echo "Set DOCKERHUB_IMAGE as a repository variable or secret, or set DOCKERHUB_USERNAME before publishing."
            exit 1
          fi
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Resolved image name: $IMAGE_NAME"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: qemu workaround
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes -c yes
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: 'linux/amd64,linux/arm64'
          tags: ${{ steps.image.outputs.name }}:${{ steps.vars.outputs.image_version }}
          build-args: |
            VITE_APP_VERSION=${{ steps.vars.outputs.git_tag }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
