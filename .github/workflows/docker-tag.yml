name: Docker build with tags

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker Hub image tag to publish from the current default branch
        required: true
        type: string

concurrency:
  group: docker-tag-${{ inputs.image_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    # 手动发版同样必须走与正式 release 相同的完整可复用门禁。
    name: Pre-publish verification
    uses: ./.github/workflows/release-preflight.yml
    with:
      run_backend_and_image: true
    secrets: inherit

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Set output
        id: vars
        run: |
          TAG_NAME="${{ inputs.image_tag }}"
           if [ -z "$TAG_NAME" ]; then
             echo "Set image_tag before manually publishing a versioned image."
             exit 1
           fi
           if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$TAG_NAME" ]; then
             echo "Run this workflow from the matching Git tag, not a branch or another ref."
             exit 1
           fi
           if [ "$TAG_NAME" != "v3.3.0a7" ]; then
            echo "image_tag must be v3.3.0a7 for this release."
            exit 1
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
      - name: Check output
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          echo $RELEASE_VERSION
          echo ${{ steps.vars.outputs.tag }}
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Resolve image name
        id: image
        run: |
          IMAGE_NAME="${{ vars.DOCKERHUB_IMAGE }}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/kirara-agent-framework"
          fi
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Resolved image name: $IMAGE_NAME"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: qemu workaround
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes -c yes
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: 'linux/amd64,linux/arm64'
          tags: ${{ steps.image.outputs.name }}:${{ steps.vars.outputs.tag }}
          build-args: |
            VITE_APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
