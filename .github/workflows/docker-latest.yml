name: Docker build latest

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: docker-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 发布门禁：镜像一旦 push 到 Docker Hub 就无法收回，因此在构建之前先跑
    # 全量后端用例 + 发布契约测试。这些检查在 PR 阶段已经跑过，但 release 是
    # 从 tag 构建的，tag 上的内容可能与当初通过 CI 的 commit 不同（例如手工
    # 打错 tag、cherry-pick 漏带 commit），所以这里必须重跑一遍。
    name: Pre-publish verification
    runs-on: ubuntu-latest
    # 草稿 release 不会发布任何镜像（下面 docker job 的资格检查会直接跳过），
    # 因此这里也不必花 runner 时间；其余情况（含预发布，它仍会推带版本号的
    # 镜像）都必须先过测试。verify 被跳过时 docker 因 needs 一并跳过，
    # 与今天「草稿不发布」的行为一致。
    if: github.event_name != 'release' || github.event.release.draft != true
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # uv.lock 指向 USTC 镜像，GitHub runner 在境外访问不稳定；--frozen 仍按
      # lock 里的 sha256 校验每个包，换索引不影响可复现性，只影响下载速度。
      # 放在 job 级，sync 与 run 两步都能生效。
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.11

      - name: Run backend suite and release contracts
        run: uv run --frozen python -m pytest ./tests -q

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Verify publish eligibility
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "publish_latest=true" >> $GITHUB_OUTPUT
            echo "Manual publish requested." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$RELEASE_IS_DRAFT" = "true" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Published release $RELEASE_TAG is a draft; Docker Hub publish skipped." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "publish_latest=false" >> $GITHUB_OUTPUT
            echo "Published prerelease $RELEASE_TAG will publish only its versioned Docker image." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ "$RELEASE_TAG" != "$latest_tag" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "publish_latest=false" >> $GITHUB_OUTPUT
            echo "Published release $RELEASE_TAG will publish only its versioned Docker image." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "publish=true" >> $GITHUB_OUTPUT
          echo "publish_latest=true" >> $GITHUB_OUTPUT
          echo "Published release $RELEASE_TAG is the current Latest release; Docker Hub publish approved." >> $GITHUB_STEP_SUMMARY
      -
        name: Checkout
        uses: actions/checkout@v6
        if: steps.release.outputs.publish == 'true'
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      -
        name: Resolve image name
        id: image
        if: steps.release.outputs.publish == 'true'
        env:
          IMAGE_NAME_VARIABLE: ${{ vars.DOCKERHUB_IMAGE }}
          IMAGE_NAME_SECRET: ${{ secrets.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_NAME="${IMAGE_NAME_VARIABLE:-$IMAGE_NAME_SECRET}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${DOCKERHUB_USERNAME}/kirara-agent-framework"
          fi
          if [ -z "$IMAGE_NAME" ]; then
            echo "Set DOCKERHUB_IMAGE as a repository variable or secret, or set DOCKERHUB_USERNAME before publishing."
            exit 1
          fi
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Resolved image name: $IMAGE_NAME"
      -
        name: Resolve image tags
        id: tags
        if: steps.release.outputs.publish == 'true'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "tags<<EOF"
            if [ "$GITHUB_EVENT_NAME" = "release" ]; then
              echo "$IMAGE_NAME:$RELEASE_TAG"
            fi
            if [ "${{ steps.release.outputs.publish_latest }}" = "true" ]; then
              echo "$IMAGE_NAME:latest"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        if: steps.release.outputs.publish == 'true'
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.publish == 'true'
      -
        name: qemu workaround
        if: steps.release.outputs.publish == 'true'
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes -c yes
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        if: steps.release.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        if: steps.release.outputs.publish == 'true'
        with:
          context: .
          push: true
          platforms: 'linux/amd64,linux/arm64'
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VITE_APP_VERSION=${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
