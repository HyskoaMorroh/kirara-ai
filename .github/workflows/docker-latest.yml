name: Docker build latest

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: docker-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Verify publish eligibility
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "publish_latest=true" >> $GITHUB_OUTPUT
            echo "Manual publish requested." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$RELEASE_IS_DRAFT" = "true" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Published release $RELEASE_TAG is a draft; Docker Hub publish skipped." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "publish_latest=false" >> $GITHUB_OUTPUT
            echo "Published prerelease $RELEASE_TAG will publish only its versioned Docker image." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ "$RELEASE_TAG" != "$latest_tag" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "publish_latest=false" >> $GITHUB_OUTPUT
            echo "Published release $RELEASE_TAG will publish only its versioned Docker image." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "publish=true" >> $GITHUB_OUTPUT
          echo "publish_latest=true" >> $GITHUB_OUTPUT
          echo "Published release $RELEASE_TAG is the current Latest release; Docker Hub publish approved." >> $GITHUB_STEP_SUMMARY
      -
        name: Checkout
        uses: actions/checkout@v4
        if: steps.release.outputs.publish == 'true'
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      -
        name: Resolve image name
        id: image
        if: steps.release.outputs.publish == 'true'
        env:
          IMAGE_NAME_VARIABLE: ${{ vars.DOCKERHUB_IMAGE }}
          IMAGE_NAME_SECRET: ${{ secrets.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_NAME="${IMAGE_NAME_VARIABLE:-$IMAGE_NAME_SECRET}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${DOCKERHUB_USERNAME}/kirara-agent-framework"
          fi
          if [ -z "$IMAGE_NAME" ]; then
            echo "Set DOCKERHUB_IMAGE as a repository variable or secret, or set DOCKERHUB_USERNAME before publishing."
            exit 1
          fi
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Resolved image name: $IMAGE_NAME"
      -
        name: Resolve image tags
        id: tags
        if: steps.release.outputs.publish == 'true'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "tags<<EOF"
            if [ "$GITHUB_EVENT_NAME" = "release" ]; then
              echo "$IMAGE_NAME:$RELEASE_TAG"
            fi
            if [ "${{ steps.release.outputs.publish_latest }}" = "true" ]; then
              echo "$IMAGE_NAME:latest"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.publish == 'true'
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.publish == 'true'
      -
        name: qemu workaround
        if: steps.release.outputs.publish == 'true'
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes -c yes
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        if: steps.release.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v4
        if: steps.release.outputs.publish == 'true'
        with:
          context: .
          push: true
          platforms: 'linux/amd64,linux/arm64'
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
