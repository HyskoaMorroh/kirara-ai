name: Docker build latest

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: docker-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Resolve image name
        id: image
        run: |
          IMAGE_NAME="${{ vars.DOCKERHUB_IMAGE }}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/kirara-agent-framework"
          fi
          if [ -z "$IMAGE_NAME" ]; then
            echo "Set repository variable DOCKERHUB_IMAGE or secret DOCKERHUB_USERNAME before publishing."
            exit 1
          fi
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Resolved image name: $IMAGE_NAME"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: qemu workaround
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes -c yes
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: 'linux/amd64,linux/arm64'
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
