name: Docker build latest

on:
  release:
    types:
      - published

concurrency:
  group: docker-latest-current
  cancel-in-progress: false

jobs:
  verify:
    # 发布门禁必须在同一次 release 调用中重跑：支持版本的后端矩阵、前端
    # type-check/unit/build、wheel/sdist、fresh-install 与 Docker readiness/API
    # smoke 都通过后，才允许后续 job 登录并 push 镜像。
    name: Pre-publish verification
    # 草稿 release 不会发布任何镜像（下面 docker job 的资格检查会直接跳过），
    # 因此这里也不必花 runner 时间；其余情况（含预发布，它仍会推带版本号的
    # 镜像）都必须先过测试。verify 被跳过时 docker 因 needs 一并跳过，
    # 与今天「草稿不发布」的行为一致。
    if: github.event_name != 'release' || github.event.release.draft != true
    uses: ./.github/workflows/release-preflight.yml
    with:
      run_backend_and_image: true
      release_tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.release_commit }}
          fetch-depth: 0
      -
        name: Verify publish eligibility
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
        run: |
          source_commit="$(git rev-parse HEAD)"
          if [ "$source_commit" != "$RELEASE_COMMIT" ]; then
            echo "Checkout commit $source_commit does not match the preflight commit $RELEASE_COMMIT."
            exit 1
          fi
          python3 scripts/version.py verify-tag \
            --tag "$RELEASE_TAG" \
            --expected-commit "$source_commit" \
            --expect-head \
            --remote origin
          EXPECTED_TAG="$(python3 scripts/version.py tag)"
          PROJECT_VERSION="$(python3 scripts/version.py get)"
          echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE_IS_DRAFT" = "true" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Published release $RELEASE_TAG is a draft; Docker Hub publish skipped." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "publish_latest=false" >> $GITHUB_OUTPUT
            echo "Published prerelease $RELEASE_TAG will publish only its versioned Docker image." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ "$RELEASE_TAG" != "$latest_tag" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "publish_latest=false" >> $GITHUB_OUTPUT
            echo "Published release $RELEASE_TAG will publish only its versioned Docker image." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "publish=true" >> $GITHUB_OUTPUT
          echo "publish_latest=true" >> $GITHUB_OUTPUT
          echo "Published release $RELEASE_TAG is the current Latest release; Docker Hub publish approved." >> $GITHUB_STEP_SUMMARY
      -
        name: Resolve image name
        id: image
        if: steps.release.outputs.publish == 'true'
        env:
          IMAGE_NAME_VARIABLE: ${{ vars.DOCKERHUB_IMAGE }}
          IMAGE_NAME_SECRET: ${{ secrets.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_NAME="${IMAGE_NAME_VARIABLE:-$IMAGE_NAME_SECRET}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${DOCKERHUB_USERNAME}/kirara-agent-framework"
          fi
          if [ -z "$IMAGE_NAME" ]; then
            echo "Set DOCKERHUB_IMAGE as a repository variable or secret, or set DOCKERHUB_USERNAME before publishing."
            exit 1
          fi
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Resolved image name: $IMAGE_NAME"
      -
        name: Resolve image tags
        id: tags
        if: steps.release.outputs.publish == 'true'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "tags<<EOF"
            if [ "$GITHUB_EVENT_NAME" = "release" ]; then
              echo "$IMAGE_NAME:$IMAGE_VERSION"
            fi
            if [ "${{ steps.release.outputs.publish_latest }}" = "true" ]; then
              echo "$IMAGE_NAME:latest"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        if: steps.release.outputs.publish == 'true'
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.publish == 'true'
      -
        name: qemu workaround
        if: steps.release.outputs.publish == 'true'
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes -c yes
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        if: steps.release.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        if: steps.release.outputs.publish == 'true'
        with:
          context: .
          push: true
          platforms: 'linux/amd64,linux/arm64'
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VITE_APP_VERSION=${{ steps.release.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
