name: Windows Quickstart

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13.2.0"
  WINPYTHON_URL: "https://github.com/winpython/winpython/releases/download/13.1.202502222final/Winpython64-3.13.2.0dot.zip"
  DIST_DIR: "C:/dist"
  BUILD_DIR: "C:/build"
  PACKAGE_NAME: "quickstart-windows-kirara-ai-amd64"

jobs:
  preflight:
    name: Release preflight
    uses: ./.github/workflows/release-preflight.yml
    with:
      run_backend_and_image: true
    secrets: inherit

  release:
    name: Verify latest release eligibility
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.eligibility.outputs.build }}
      publish: ${{ steps.eligibility.outputs.publish }}
    steps:
      - name: Decide whether to build a Windows package
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Manual request will create a temporary artifact only." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$RELEASE_IS_DRAFT" = "true" ] || [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            echo "build=false" >> $GITHUB_OUTPUT
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Windows package skipped because the release is not a formal Latest release." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ "$RELEASE_TAG" != "$latest_tag" ]; then
            echo "build=false" >> $GITHUB_OUTPUT
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Windows package skipped because $RELEASE_TAG is not the current Latest release ($latest_tag)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "build=true" >> $GITHUB_OUTPUT
          echo "publish=true" >> $GITHUB_OUTPUT
          echo "Windows package approved for current Latest release $RELEASE_TAG." >> $GITHUB_STEP_SUMMARY

  build:
    name: Windows Quickstart
    runs-on: windows-latest
    needs: [preflight, release]
    if: needs.release.outputs.build == 'true'
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.release.tag_name || github.sha }}

    - name: Set up Python for building
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Build wheel package
      run: |
        python -m pip install build
        python -m build
        # 获取生成的wheel文件名
        $WheelFile = Get-ChildItem -Path "dist" -Filter "*.whl" | Select-Object -First 1 -ExpandProperty Name
        echo "WHEEL_FILE=$WheelFile" >> $env:GITHUB_ENV

    - name: Prepare distribution environment
      run: |
        # 创建必要的目录
        mkdir ${{ env.DIST_DIR }}
        mkdir ${{ env.BUILD_DIR }}
        
        # 下载 WinPython
        Invoke-WebRequest -Uri "${{ env.WINPYTHON_URL }}" -OutFile "${{ env.BUILD_DIR }}/winpython.zip"
        Expand-Archive "${{ env.BUILD_DIR }}/winpython.zip" -DestinationPath "${{ env.DIST_DIR }}"

    - name: Install project and dependencies
      run: |
        cd ${{ env.DIST_DIR }}
        ./WPy64-31320/python/python.exe -m pip install "${{ github.workspace }}/dist/${{ env.WHEEL_FILE }}"
        ./WPy64-31320/python/python.exe -m pip install --upgrade pip

    - name: Verify the bundled interpreter can import the shipped wheel
      # 快速启动包是「解释器 + wheel」的组合，二者任一坏了用户开箱即崩。
      # 在打包用的 WinPython 里真的 import 一次，并确认 package-data 到位
      # （/backup 页面与预设工作流都曾缺失过，靠的就是这类断言兜住）。
      #
      # working-directory 必须离开 github.workspace：仓库根下就有 kirara_ai/
      # 源码目录，`python -` 会把 cwd 放进 sys.path[0]，在 workspace 里跑会
      # 导入源码而不是装好的 wheel，检查就白做了。
      working-directory: ${{ env.DIST_DIR }}
      env:
        PYTHONUTF8: "1"
      run: |
        $verify = @'
        import importlib.util, pathlib
        import kirara_ai
        root = pathlib.Path(next(iter(importlib.util.find_spec("kirara_ai").submodule_search_locations)))
        assert (root / "web" / "static" / "backup.html").is_file(), "backup.html missing"
        presets = sorted((root / "workflow" / "presets" / "chat").glob("*.yaml"))
        assert any(p.name == "normal_multimodal.yaml" for p in presets), presets
        print(f"quickstart wheel OK: {kirara_ai.__file__}, {len(presets)} chat presets")
        '@
        $verify | & "${{ env.DIST_DIR }}/WPy64-31320/python/python.exe" -

    - name: Download and setup FFmpeg
      run: |
        $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
        $archivePath = "${{ env.BUILD_DIR }}/ffmpeg.zip"
        $extractPath = "${{ env.BUILD_DIR }}/ffmpeg-extract"
        Invoke-WebRequest -Uri $ffmpegUrl -OutFile $archivePath

        $expectedHash = ((Invoke-RestMethod -Uri "$ffmpegUrl.sha256").Trim() -split '\s+')[0].ToUpperInvariant()
        $actualHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToUpperInvariant()
        if ($actualHash -ne $expectedHash) {
          throw "FFmpeg archive SHA-256 verification failed."
        }

        Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
        $sourceBin = Get-ChildItem -Path $extractPath -Directory -Recurse |
          Where-Object { Test-Path (Join-Path $_.FullName "ffmpeg.exe") } |
          Select-Object -First 1
        if ($null -eq $sourceBin) {
          throw "FFmpeg executable was not found in the downloaded archive."
        }

        New-Item -ItemType Directory -Path "${{ env.DIST_DIR }}/ffmpeg" -Force | Out-Null
        Move-Item -Path $sourceBin.FullName -Destination "${{ env.DIST_DIR }}/ffmpeg/bin"

    - name: Download VC++ Runtime
      run: |
        Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "${{ env.DIST_DIR }}/【语音功能依赖】vc_redist.x64.exe"

    - name: Set up Node.js for Web UI
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'yarn'
        cache-dependency-path: webui/yarn.lock

    - name: Build bundled Web UI
      working-directory: webui
      env:
        VITE_APP_VERSION: ${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}
      run: |
        corepack enable
        yarn install --frozen-lockfile
        yarn type-check
        yarn test:unit
        yarn build

    - name: Setup Web UI
      run: |
        New-Item -ItemType Directory -Force -Path "${{ env.DIST_DIR }}/web"
        Copy-Item -Path "webui/dist/*" -Destination "${{ env.DIST_DIR }}/web" -Force -Recurse

    - name: Verify bundled Web UI release identity
      env:
        EXPECTED_UI_VERSION: ${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}
      run: |
        $uiFiles = Get-ChildItem -Path "${{ env.DIST_DIR }}/web" -File -Recurse
        if ($uiFiles.Count -eq 0) {
          throw "Bundled Web UI is empty."
        }
        $uiText = ($uiFiles | ForEach-Object {
          Get-Content -LiteralPath $_.FullName -Raw -ErrorAction Stop
        }) -join "`n"
        if (-not $uiText.Contains($env:EXPECTED_UI_VERSION)) {
          throw "Bundled Web UI does not contain $env:EXPECTED_UI_VERSION."
        }
        if ($uiText -match '0\.0\.0-ci') {
          throw "Bundled Web UI contains the CI fallback version."
        }
        $devVersions = [regex]::Matches($uiText, '(?i)dev-[0-9a-f]{7,40}') |
          ForEach-Object { $_.Value } |
          Select-Object -Unique
        $unexpectedDevVersions = if ($env:EXPECTED_UI_VERSION -match '^(?i:dev-)') {
          $devVersions | Where-Object { $_ -ne $env:EXPECTED_UI_VERSION }
        } else {
          $devVersions
        }
        if ($unexpectedDevVersions) {
          throw "Bundled Web UI contains unexpected dev versions: $($unexpectedDevVersions -join ', ')."
        }

    - name: Copy startup scripts
      run: |
        Copy-Item ".github/quickstarts/windows/scripts/*" -Destination "${{ env.DIST_DIR }}/" -Recurse

    - name: Upload workflow artifacts
      uses: actions/upload-artifact@v5
      with:
        name: ${{ env.PACKAGE_NAME }}
        path: ${{ env.DIST_DIR }}

    - name: Create release archive
      if: needs.release.outputs.publish == 'true'
      run: |
        Get-ChildItem -Path "${{ env.DIST_DIR }}" -Recurse -Force -File |
          Where-Object { $_.Name -match '\.(pyc|pyo)$' } |
          Remove-Item -Force
        Get-ChildItem -Path "${{ env.DIST_DIR }}" -Recurse -Force -Directory |
          Where-Object { $_.Name -in @('__pycache__', '.pytest_cache', '.mypy_cache', '.ruff_cache') } |
          Sort-Object FullName -Descending |
          Remove-Item -Force -Recurse
        Compress-Archive -Path "${{ env.DIST_DIR }}/*" -DestinationPath "${{ env.BUILD_DIR }}/${{ env.PACKAGE_NAME }}.zip"

    - name: Verify final release archive contents
      if: needs.release.outputs.publish == 'true'
      env:
        ARCHIVE_PATH: ${{ env.BUILD_DIR }}/${{ env.PACKAGE_NAME }}.zip
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($env:ARCHIVE_PATH)
          try {
          $entries = @($archive.Entries |
            Where-Object { -not $_.FullName.EndsWith('/') } |
            ForEach-Object {
              $name = $_.FullName.Replace('\', '/')
              while ($name.StartsWith('./')) { $name = $name.Substring(2) }
              $name = $name.TrimStart('/')
              $name
            })
          $lower = @($entries | ForEach-Object { $_.ToLowerInvariant() })

          $allowedTopLevel = @(
            'wpy64-31320',
            'ffmpeg',
            'web',
            '启动.cmd',
            '【语音功能依赖】vc_redist.x64.exe'
          )
          $topLevel = @($lower | ForEach-Object { ($_ -split '/', 2)[0] } | Sort-Object -Unique)
          $unexpectedTopLevel = @($topLevel | Where-Object { $_ -notin $allowedTopLevel })
          if ($unexpectedTopLevel.Count -gt 0) {
            throw "Final ZIP contains unexpected top-level content: $($unexpectedTopLevel -join ', ')"
          }

          $required = @(
            'web/index.html',
            '启动.cmd',
            'wpy64-31320/python/python.exe',
            'wpy64-31320/python/lib/site-packages/kirara_ai/workflow/presets/catalog.json'
          )
          foreach ($path in $required) {
            if ($lower -notcontains $path) {
              throw "Final ZIP is missing required content: $path"
            }
          }

          $forbidden = @($lower | Where-Object {
            $_ -match '(^|/)\.env($|/)' -or
            $_ -match '(^|/)\.venv($|/)' -or
            $_ -match '(^|/)(\.git|\.github|docs|tests|data|build|dist|node_modules|patches|fsdownload)($|/)' -or
            $_ -match '(^|/)(__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache)($|/)' -or
            $_ -match '(^|/)config\.yaml($|/)' -or
            $_ -match '\.(pyc|pyo)$'
          })
          if ($forbidden.Count -gt 0) {
            throw "Final ZIP contains forbidden content: $($forbidden[0..([Math]::Min(9, $forbidden.Count - 1))] -join ', ')"
          }
          Write-Host "Final ZIP allow/deny checks passed for $($entries.Count) entries."
        }
        finally {
          $archive.Dispose()
        }

    - name: Upload release archive
      if: needs.release.outputs.publish == 'true'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ env.BUILD_DIR }}/${{ env.PACKAGE_NAME }}.zip
        asset_name: Windows-quickstart-kirara-ai-${{ github.ref_name }}.zip
        tag: ${{ github.ref_name }}
        overwrite: false
        body: "Windows x64 用户的快速启动包"
