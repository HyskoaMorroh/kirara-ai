services:
  kirara-agent:
    image: ${DOCKERHUB_IMAGE:?Set DOCKERHUB_IMAGE in the server .env file}
    container_name: kirara-agent
    restart: always
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # 数据目录
      - ./data:/app/data

    ports:
      - "8759:8080"

    # 健康检查（可选，但推荐）
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8080), 2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s


    # 日志配置（可选）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
