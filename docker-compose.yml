services:
  kirara-agent:
    image: ${DOCKERHUB_IMAGE:?Set DOCKERHUB_IMAGE in the server .env file}
    container_name: kirara-agent
    restart: always
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      DATA_PATH: /app/data
    volumes:
      # 数据目录
      - ./data:/app/data

    ports:
      - "8759:8080"

    # 匿名 HTTP liveness；认证后的 readiness 由发布门禁单独验证。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s


    # 日志配置（可选）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
