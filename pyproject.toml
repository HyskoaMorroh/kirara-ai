[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kirara-ai"
version = "3.3.0a5"
authors = [
    { name="Lss233", email="i@lss233.com" },
]
description = "A framework for building AI agents"
readme = "README.md"
requires-python = ">=3.10"
# mcp组件仅支持python3.10及以上版本
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "AGPL-3.0-only"
license-files = ["LICENSE"]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-core>=2.27.2",
    "ruamel.yaml",
    "pytest",
    "pytest-asyncio",
    "python-telegram-bot",
    "telegramify-markdown",
    "loguru",
    "aiohttp",
    "requests",
    "quart>=0.18.4",
    "quart-cors>=0.7.0",
    "fastapi>=0.110.0",
    "wechatpy",
    "pycryptodome",
    "redis[hiredis]",
    "bcrypt>=4.0.1",
    "PyJWT>=2.8.0",
    "hypercorn>=0.15.0",
    "psutil>=5.9.0",
    "setuptools",
    "tomli>=2.0.0",
    "pre-commit",
    "curl_cffi",
    "python-magic ; platform_system != 'Windows'",
    "python-magic-bin ; platform_system == 'Windows'",
    "ymbotpy",
    "Pillow",
    "pytz",
    "sqlalchemy",
    "alembic",
    # mcp 2.x 移除了 McpError 等接口，pygls 2.x 移除了 pygls.server.LanguageServer，均需锁定 1.x
    "mcp>=1.6,<2",
    "pygls>=1.3,<2",
    "jedi",
    "pyflakes",
]


[project.scripts]
kirara_ai = "kirara_ai.__main__:main"

[project.urls]
"Homepage" = "https://github.com/lss233/chatgpt-mirai-qq-bot"
"Bug Tracker" = "https://github.com/lss233/chatgpt-mirai-qq-bot/issues"
"Documentation" = "https://kirara-docs.app.lss233.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["kirara_ai*"]
# Bytecode directories can appear after tests or a local start.  They are
# namespace-package candidates unless excluded explicitly, which makes wheel
# builds emit a misleading package-discovery warning.
exclude = ["*.__pycache__", "*.__pycache__.*"]
namespaces = true

# 后端自带页面（如 /backup 备份恢复页）需随 wheel 一起分发，
# 否则 pip 安装或 Docker 镜像里会缺失该目录，访问 /backup 得到 404。
# 预设工作流（presets/*/*.yaml）同理：缺失时 pip 安装的用户拿不到
# 多模态、分段回复等进阶模板。
[tool.setuptools.package-data]
"kirara_ai.web" = ["static/*"]
"kirara_ai.workflow.presets" = ["*/*.yaml"]

# 不把本机运行或构建时生成的字节码带进 wheel。源码会由 Python 在目标环境
# 按实际解释器版本重新生成缓存；将其打包既无运行收益，也会降低构建可复现性。
[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[[tool.uv.index]]
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true

[options]
include_package_data = true

[tool.mypy]
disable_error_code = "override, assignment, annotation-unchecked, import-untyped"
