[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kirara-ai"
version = "3.3.0b18"
authors = [
    { name="Lss233", email="i@lss233.com" },
]
description = "A framework for building AI agents"
readme = "README.md"
requires-python = ">=3.10"
# mcp组件仅支持python3.10及以上版本
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "AGPL-3.0-only"
license-files = ["LICENSE"]

dependencies = [
    "packaging>=23.0",
    "jsonschema>=4.0",
    "pydantic>=2.0.0",
    "pydantic-core>=2.27.2",
    "ruamel.yaml",
    "pytest",
    "pytest-asyncio",
    "python-telegram-bot",
    "telegramify-markdown",
    "loguru",
    "aiohttp",
    "requests",
    "quart>=0.18.4",
    "quart-cors>=0.7.0",
    "fastapi>=0.110.0",
    "wechatpy",
    "pycryptodome",
    "redis[hiredis]",
    "bcrypt>=4.0.1",
    "PyJWT>=2.8.0",
    "hypercorn>=0.15.0",
    "aiocqhttp>=1.4.4,<2",
    "psutil>=5.9.0",
    "setuptools",
    "tomli>=2.0.0",
    "pre-commit",
    "curl_cffi",
    "python-magic ; platform_system != 'Windows'",
    "python-magic-bin ; platform_system == 'Windows'",
    "ymbotpy",
    "Pillow",
    "pytz",
    "sqlalchemy",
    "alembic",
    "filelock>=3.12",
    # mcp 2.x 移除了 McpError 等接口，pygls 2.x 移除了 pygls.server.LanguageServer，均需锁定 1.x
    "mcp>=1.6,<2",
    "pygls>=1.3,<2",
    "jedi",
    "pyflakes",

    # ---- 随包技能的运行依赖 ----
    #
    # 这些包不被 kirara_ai 自身 import，而是**随包技能的脚本**要用的。
    # 不预装的后果不是「少一个功能」，而是「界面上装好了、一使用就 ImportError」——
    # 那比不提供这个技能更糟：用户按文档操作，得到一个与操作无关的报错。
    #
    # CC Switch 的做法是只放技能目录、不管依赖，因为它跑在开发者本机（那里恰好
    # 什么都有）。本项目跑在别人的 VPS 上，照搬那个做法必然踩这个坑。
    #
    # 判据是「这个包被哪个随包技能 import」，不是「可能有用」：
    # 逐个扫过 115 个技能的 .py 文件取 import 名再减去标准库得出。
    "lxml>=5.0",             # docx / pptx / xlsx：OOXML 解析
    "defusedxml>=0.7",       # 同上，防 XXE 的安全解析器
    "openpyxl>=3.1",         # xlsx：读写 Excel
    "python-docx>=1.1",      # docx：读写 Word
    "python-pptx>=0.6.23",   # pptx 与六个 PPT 类技能
    "pypdf>=4.0",            # pdf：读取与表单
    "pdfplumber>=0.11",      # pdf：文本与表格抽取
    "pdf2image>=1.17",       # pdf：转图片（另需系统 poppler-utils，见 Dockerfile）
    "orjson>=3.9",           # planning-with-files 全系列（6 个技能）
    "PyYAML>=6.0",           # skill-creator 等
    "rich>=13.0",            # 若干技能的终端输出
    "numpy>=1.26",           # 图像处理类 PPT 技能
]


[project.scripts]
kirara_ai = "kirara_ai.__main__:main"

[project.urls]
# Homepage / Bug Tracker 指向本仓库：issues 收的是本仓库的 bug 报告。
# Documentation 仍指上游文档站——本仓库没有自建文档站，改成 fork 地址只会变死链。
"Homepage" = "https://github.com/HyskoaMorroh/kirara-ai"
"Bug Tracker" = "https://github.com/HyskoaMorroh/kirara-ai/issues"
"Documentation" = "https://kirara-docs.app.lss233.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["kirara_ai*"]
# Bytecode directories can appear after tests or a local start.  They are
# namespace-package candidates unless excluded explicitly, which makes wheel
# builds emit a misleading package-discovery warning.
exclude = ["*.__pycache__", "*.__pycache__.*"]
namespaces = true

# 后端自带页面（如 /backup 备份恢复页）需随 wheel 一起分发，
# 否则 pip 安装或 Docker 镜像里会缺失该目录，访问 /backup 得到 404。
# 预设工作流（presets/*/*.yaml）同理：缺失时 pip 安装的用户拿不到
# 多模态、分段回复等进阶模板。
[tool.setuptools.package-data]
"kirara_ai.web" = ["static/*"]
"kirara_ai.plugins.im_onebot_adapter" = ["assets/*"]
"kirara_ai.workflow.presets" = ["*/*.yaml", "catalog.json"]
# 随包技能正文（31 条 `bundled_dir` 内置条目）。`**/*` 覆盖技能目录下的
# 子目录，因为技能天然是多文件的：SKILL.md 加若干参考文档。
# 两个索引与两类随包正文都要列全。`include_package_data = true` 让
# `MANIFEST.in` 的递归包含也对 wheel 生效，因此漏写一项**当前**不会出问题——
# 但那是靠另一条规则兜着。两条各自独立成立，改动任一条才不会让
# 随包资源在 pip 安装的部署上静默消失。
"kirara_ai.plugin_manager" = [
    "bundled/skills_index.json",
    "bundled/prompts_index.json",
    "bundled/skills/**/*",
    "bundled/prompts/**/*",
]

# 不把本机运行或构建时生成的字节码带进 wheel。源码会由 Python 在目标环境
# 按实际解释器版本重新生成缓存；将其打包既无运行收益，也会降低构建可复现性。
[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

# 默认索引使用官方 PyPI。uv.lock 会记录解析出的下载地址，锁文件要随仓库分发
# 并在 GitHub Actions（境外 runner）上通过 `uv sync --frozen` 校验，因此这里
# 不能指向国内镜像——镜像地址在境外访问不稳定，会让 CI 与镜像构建失败。
# 国内开发者如需加速，在本机设置环境变量覆盖即可，不必修改本文件：
#   UV_DEFAULT_INDEX=https://mirrors.ustc.edu.cn/pypi/simple
# `--frozen` 下 uv 仍按 lock 里记录的 sha256 校验每个包，换源不影响可复现性。
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[options]
include_package_data = true

[tool.mypy]
disable_error_code = "override, assignment, annotation-unchecked, import-untyped"
