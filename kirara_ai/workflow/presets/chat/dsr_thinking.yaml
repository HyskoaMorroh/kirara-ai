name: 聊天 - 深度思考
description: DeepSeek 思考模型聊天，隐藏 <think> 标签内容
blocks:
  - type: internal:get_message
    name: get_message
    params: {}
    position:
      x: 120
      y: 120
    connected_to:
      - target: ToggleEditState_81bvwg
        mapping:
          from: sender
          to: sender
      - target: query_memory
        mapping:
          from: sender
          to: chat_sender
      - target: ChatMessageConstructor_g44tpp
        mapping:
          from: msg
          to: user_msg
      - target: ChatMemoryStore_ljrym0
        mapping:
          from: msg
          to: user_msg
  - type: internal:toggle_edit_state
    name: ToggleEditState_81bvwg
    params:
      is_editing: true
    position:
      x: 520
      y: 120
  - type: internal:chat_memory_query
    name: query_memory
    params:
      scope_type: group
    position:
      x: 520
      y: 540
    connected_to:
      - target: ChatMessageConstructor_g44tpp
        mapping:
          from: memory_content
          to: memory_content
  - type: internal:text_block
    name: user_prompt
    params:
      text: '{user_name}说：{user_msg}'
    position:
      x: 120
      y: 540
    connected_to:
      - target: ChatMessageConstructor_g44tpp
        mapping:
          from: text
          to: user_prompt_format
  - type: internal:chat_message_constructor
    name: ChatMessageConstructor_g44tpp
    params: {}
    position:
      x: 920
      y: 120
    connected_to:
      - target: llm_chat
        mapping:
          from: llm_msg
          to: prompt
  - type: internal:llm_response_to_text
    name: e4fe53bb-fcbe-41c3-ab69-e8d3881c3b55
    params: {}
    position:
      x: 1720
      y: 120
    connected_to:
      - target: ef6c7eed-307e-4fa0-94f0-a82c98c784b3
        mapping:
          from: text
          to: text
  - type: internal:text_extract_by_regex_block
    name: ef6c7eed-307e-4fa0-94f0-a82c98c784b3
    params:
      regex: (?:<think>[\s\S]*?</think>)?([\s\S]*)
    position:
      x: 2120
      y: 120
    connected_to:
      - target: 7b5f6be8-da97-417e-bbeb-c9549ac45e9e
        mapping:
          from: text
          to: text
  - type: internal:text_to_im_message
    name: 7b5f6be8-da97-417e-bbeb-c9549ac45e9e
    params:
      split_by: <break>
    position:
      x: 2520
      y: 120
    connected_to:
      - target: SendIMMessage_x9ro8t
        mapping:
          from: msg
          to: msg
  - type: internal:send_message
    name: SendIMMessage_x9ro8t
    params: {}
    position:
      x: 2920
      y: 120
  - type: internal:text_block
    name: system_prompt
    params:
      text: "# Information\n当前系统时间：{current_date_time}\n\n# Memories\n以下是历史对话上下文（用于理解代词和背景，无需复述）：\n-- 对话记录开始 --\n{memory_content}\n-- 对话记录结束 --\n\n# Rules\n1. **控制标记**：`<break>` 仅代表“发送消息”的动作逻辑。请按需插入，但**严禁**将其作为可见文本直接输出。\n2. **记忆逻辑**：当用户使用代词（如“它”、“那个”、“继续”）或引用前文时，**必须**基于 `# Memories` 中的内容进行逻辑关联，但不要在回复中显式提到“根据记忆”。\n3. **回复指令**：基于以上信息，直接处理用户的最新消息。\n   - **拒绝客套**：禁止使用“你好”、“作为一个AI”等无意义的开场白。\n   - **专家视角**：请默认以该领域的**资深专家/博士**身份进行回答。确保内容的**深度、严谨性**和**专业术语**的准确使用，避免过于通俗化。\n   - **原版直出**：直接输出核心结论或分析，保持客观中立。"
    position:
      x: 120
      y: 960
    connected_to:
      - target: ChatMessageConstructor_g44tpp
        mapping:
          from: text
          to: system_prompt_format
  - type: internal:chat_memory_store
    name: ChatMemoryStore_ljrym0
    params:
      scope_type: group
    position:
      x: 1720
      y: 540
  # 模型槽位一律留空：原先这里写死了 claude-opus-4-8 / gpt-5.6-sol 等 ID，
  # 而这些 ID 在绝大多数用户的配置里并不存在，编辑器上 5 个槽位全是空白，
  # 运行时也只能靠兜底模型。请在下拉框中手动选择本机已配置的模型；
  # 本模板针对带 <think> 标签的推理模型（如 deepseek-reasoner）设计。
  - type: internal:chat_completion
    name: llm_chat
    params:
      model_name: ''
      fallback_model_1: ''
      fallback_model_2: ''
      fallback_model_3: ''
      fallback_model_4: ''
      max_retries: 3
    position:
      x: 1320
      y: 120
    connected_to:
      - target: ChatMemoryStore_ljrym0
        mapping:
          from: resp
          to: llm_resp
      - target: e4fe53bb-fcbe-41c3-ab69-e8d3881c3b55
        mapping:
          from: resp
          to: response
